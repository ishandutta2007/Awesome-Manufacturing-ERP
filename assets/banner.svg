<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Simple Glow Filter without feComposite issues -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    .gear-slow {
      transform-origin: 1000px 150px;
      animation: spinClockwise 40s linear infinite;
    }
    .gear-fast {
      transform-origin: 150px 80px;
      animation: spinCounterClockwise 25s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="300" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- DYNAMIC BACKGROUND GEARS -->
  <g class="gear-slow">
    <circle cx="1000" cy="150" r="70" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="8" stroke-dasharray="12 8" />
    <circle cx="1000" cy="150" r="45" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="4" />
    <circle cx="1000" cy="150" r="20" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
  </g>

  <g class="gear-fast">
    <circle cx="150" cy="80" r="50" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="10 6" />
    <circle cx="150" cy="80" r="30" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="3" />
  </g>

  <!-- Decorative Network Lines -->
  <path d="M 100 240 L 400 240 L 450 270 L 800 270" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6" />
  <path d="M 850 50 L 1050 50 L 1100 80" fill="none" stroke="#ec4899" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Grid Nodes Accent -->
  <circle cx="400" cy="240" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="450" cy="270" r="4" fill="#8b5cf6" opacity="0.6" />
  <circle cx="1050" cy="50" r="4" fill="#ec4899" opacity="0.6" />

  <!-- Decorative Top Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" />

  <!-- FOREGROUND CONTENT -->
  
  <!-- Category Pill Badge -->
  <g transform="translate(80, 50)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8" />
    <text x="36" y="21" class="badge-text">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title & Accent Bar -->
  <g transform="translate(80, 135)">
    <text x="0" y="0" class="title">Awesome Manufacturing ERP</text>
    <rect x="0" y="15" width="180" height="4" rx="2" fill="url(#accentGrad)" />
  </g>

  <!-- Subtitle -->
  <text x="80" y="195" class="subtitle">Production Planning • MRP • BOM • Shop-Floor Control • Open-Source &amp; SaaS Ecosystem</text>

  <!-- Tech Tag Pills (Bottom Left) -->
  <g transform="translate(80, 230)">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="45" y="17" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Odoo MRP</text>
    
    <rect x="100" y="0" width="85" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="142.5" y="17" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">ERPNext</text>

    <rect x="195" y="0" width="80" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="235" y="17" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">MRPeasy</text>

    <rect x="285" y="0" width="105" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="337.5" y="17" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Katana MRP</text>
  </g>
</svg>
