<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Dynamic Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Keyframe Animations for Dynamic Elements */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes dashPulse {
      0% { stroke-dashoffset: 100; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }

    .gear-slow {
      transform-origin: 1000px 150px;
      animation: spinClockwise 40s linear infinite;
    }
    .gear-fast {
      transform-origin: 150px 80px;
      animation: spinCounterClockwise 25s linear infinite;
    }
    .flow-line {
      stroke-dasharray: 12, 12;
      animation: dashPulse 8s linear infinite;
    }
    .ambient-wave {
      animation: waveMove 10s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="300" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Behind Text) -->

  <!-- Animated Gear 1 (Right Side Background) -->
  <g class="gear-slow">
    <path d="M1000,100 L1010,100 L1014,115 L1028,121 L1040,111 L1048,118 L1042,132 L1051,143 L1066,143 L1069,153 L1056,162 L1053,176 L1064,187 L1057,195 L1043,190 L1031,199 L1033,214 L1023,219 L1014,206 L1000,209 L993,223 L983,220 L984,205 L971,197 L957,204 L950,195 L960,183 L955,169 L940,166 L940,155 L954,148 L956,134 L944,124 L951,116 L965,122 L977,114 L974,99 L984,95 L993,108 Z" 
          fill="url(#gearGrad)" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="1000" cy="150" r="35" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />
  </g>

  <!-- Animated Gear 2 (Top Left Background) -->
  <g class="gear-fast">
    <path d="M150,50 L156,50 L158,60 L167,64 L175,58 L180,63 L176,72 L182,79 L192,79 L194,86 L185,92 L183,101 L190,108 L185,113 L176,110 L168,116 L170,126 L163,129 L157,121 L148,123 L144,132 L137,130 L138,120 L129,115 L120,119 L115,113 L122,106 L118,97 L108,95 L108,88 L117,83 L119,74 L111,67 L116,62 L125,66 L133,60 L131,50 L138,48 L144,57 Z" 
          fill="url(#gearGrad)" stroke="#818cf8" stroke-opacity="0.15" stroke-width="2" />
  </g>

  <!-- Dynamic Factory Mesh Lines -->
  <g class="ambient-wave" opacity="0.25">
    <path d="M -50 220 Q 200 160 450 230 T 950 200 T 1250 250" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M -50 240 Q 250 290 550 210 T 1050 230 T 1250 180" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
  </g>

  <!-- Animated Data Supply Chain Pulse Lines -->
  <path class="flow-line" d="M 100 240 L 400 240 L 450 270 L 800 270" fill="none" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2" />
  <path class="flow-line" d="M 850 50 L 1050 50 L 1100 80" fill="none" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2" />

  <!-- Grid Nodes Accent -->
  <circle cx="400" cy="240" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="450" cy="270" r="4" fill="#8b5cf6" opacity="0.6" />
  <circle cx="1050" cy="50" r="4" fill="#ec4899" opacity="0.6" />

  <!-- Decorative Top Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" />

  <!-- FOREGROUND CONTENT (Guaranteed crisp visibility) -->
  
  <!-- Category Pill Badge -->
  <g transform="translate(80, 55)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text x="32" y="21" class="badge-text">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title & Accent Bar -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" class="title">Awesome Manufacturing ERP ⚙️</text>
    <rect x="0" y="15" width="160" height="4" rx="2" fill="url(#accentGrad)" />
  </g>

  <!-- Subtitle -->
  <text x="80" y="195" class="subtitle">Production Planning • MRP • BOM • Shop-Floor Control • Open-Source & SaaS Ecosystem</text>

  <!-- Tech Tag Pills (Bottom Left) -->
  <g transform="translate(80, 230)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="45" y="17" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Odoo MRP</text>
    
    <!-- Tag 2 -->
    <rect x="100" y="0" width="85" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="142.5" y="17" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">ERPNext</text>

    <!-- Tag 3 -->
    <rect x="195" y="0" width="80" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="235" y="17" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">MRPeasy</text>

    <!-- Tag 4 -->
    <rect x="285" y="0" width="105" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="337.5" y="17" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Katana MRP</text>
  </g>
</svg>
